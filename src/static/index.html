<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tester Strategii</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#030712',
                            800: '#0B0F19',
                            700: '#1E293B',
                            600: '#334155'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-900 text-slate-100 font-sans antialiased min-h-screen flex flex-col">

    <header class="border-b border-dark-700 bg-dark-800/50 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-sky-500 rounded-full"></div>
            <h1 class="text-xl font-bold tracking-wider text-sky-400">TESTER STRATEGII <span class="text-xs text-slate-400 font-normal ml-2">BTCUSDT</span></h1>
        </div>
        <div id="status-badge" class="text-xs px-3 py-1 rounded-full bg-dark-700 text-slate-300 border border-dark-600">
            Gotowy
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-80 border-r border-dark-700 bg-dark-800 p-6 flex flex-col justify-between">
            <div class="space-y-6">
                <div>
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Ustawienia</h2>
                    <label class="block text-xs text-slate-400 mb-2">Aktywo</label>
                    <select disabled class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3 py-2.5 text-sm text-slate-200 focus:outline-none cursor-not-allowed mb-4">
                        <option value="BTCUSDT">BTCUSDT</option>
                    </select>

                    <label class="block text-xs text-slate-400 mb-2">Interwał</label>
                    <select id="interval-select" class="w-full bg-dark-900 border border-dark-700 rounded-lg px-3 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-sky-500 mb-4">
                        <option value="5m">5m</option>
                        <option value="15m">15m</option>
                        <option value="1h" selected>1h</option>
                        <option value="4h">4h</option>
                    </select>

                    <label class="block text-xs text-slate-400 mb-2">Liczba świec: <span id="limit-val" class="text-sky-400 font-bold">5000</span></label>
                    <input type="range" id="limit-range" min="1000" max="10000" step="500" value="5000" class="w-full accent-sky-500 bg-dark-900 cursor-pointer" oninput="document.getElementById('limit-val').innerText = this.value">
                </div>

                <div class="pt-4 border-t border-dark-700">
                    <button onclick="runBacktest()" id="run-btn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 text-sm">
                        Uruchom test
                    </button>
                </div>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto space-y-8">
            <div>
                <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Najlepsza strategia</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                    <div class="bg-dark-800 border border-dark-700 p-5 rounded-xl shadow-md">
                        <span class="text-xs text-slate-400 block mb-1">Strategia</span>
                        <span id="kpi-strategy" class="text-lg font-bold text-sky-400">-</span>
                    </div>
                    <div class="bg-dark-800 border border-dark-700 p-5 rounded-xl shadow-md">
                        <span class="text-xs text-slate-400 block mb-1">Skuteczność</span>
                        <span id="kpi-winrate" class="text-lg font-bold text-emerald-400">-</span>
                    </div>
                    <div class="bg-dark-800 border border-dark-700 p-5 rounded-xl shadow-md">
                        <span class="text-xs text-slate-400 block mb-1">Zysk (PnL)</span>
                        <span id="kpi-pnl" class="text-lg font-bold text-slate-100">-</span>
                    </div>
                    <div class="bg-dark-800 border border-dark-700 p-5 rounded-xl shadow-md">
                        <span class="text-xs text-slate-400 block mb-1">Dopasowanie K-NN</span>
                        <span id="kpi-knn" class="text-lg font-bold text-sky-300">-</span>
                    </div>
                </div>
            </div>

            <div class="bg-dark-800 border border-dark-700 rounded-xl overflow-hidden shadow-xl">
                <div class="px-6 py-4 border-b border-dark-700 flex justify-between items-center">
                    <h3 class="font-semibold text-slate-200">Ranking strategii</h3>
                    <button onclick="loadResults()" class="text-xs text-sky-400 hover:text-sky-300 transition">Odśwież</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-dark-700 bg-dark-900/50 text-xs text-slate-400 uppercase tracking-wider">
                                <th class="py-3 px-6">Poz.</th>
                                <th class="py-3 px-6">Strategia</th>
                                <th class="py-3 px-6">Skuteczność</th>
                                <th class="py-3 px-6">Zysk (PnL)</th>
                                <th class="py-3 px-6">Max Straty</th>
                                <th class="py-3 px-6">Transakcje</th>
                                <th class="py-3 px-6">Status</th>
                            </tr>
                        </thead>
                        <tbody id="results-table" class="divide-y divide-dark-700 text-sm">
                            <tr>
                                <td colspan="7" class="py-6 text-center text-slate-500">Brak wyników.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const symbol = "BTCUSDT";
        const statusBadge = document.getElementById('status-badge');

        async function loadResults() {
            try {
                const response = await fetch(`/api/results/${symbol}`);
                const data = await response.json();
                const tbody = document.getElementById('results-table');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="py-6 text-center text-slate-500">Brak wyników.</td></tr>`;
                    return;
                }

                const top = data[0];
                document.getElementById('kpi-strategy').innerText = top.strategy_name;
                document.getElementById('kpi-winrate').innerText = top.win_rate.toFixed(2) + '%';
                document.getElementById('kpi-pnl').innerText = '$ ' + top.pnl.toLocaleString('en-US', {minimumFractionDigits: 2});
                document.getElementById('kpi-knn').innerText = top.similarity_score ? top.similarity_score.toFixed(1) + '%' : 'Brak';

                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-dark-700/50 transition";
                    tr.innerHTML = `
                        <td class="py-4 px-6 font-mono text-slate-400">#${row.rank}</td>
                        <td class="py-4 px-6 font-medium text-slate-200">${row.strategy_name}</td>
                        <td class="py-4 px-6 text-emerald-400 font-semibold">${row.win_rate.toFixed(2)}%</td>
                        <td class="py-4 px-6 font-mono ${row.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}">$ ${row.pnl.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                        <td class="py-4 px-6 font-mono text-slate-400">$ ${row.max_drawdown.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                        <td class="py-4 px-6 text-slate-300">${row.trades_count}</td>
                        <td class="py-4 px-6 text-xs text-sky-400">${row.similarity_score ? 'K-NN (' + row.similarity_score + '%)' : 'Standard'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function runBacktest() {
            const interval = document.getElementById('interval-select').value;
            const limit = document.getElementById('limit-range').value;
            const btn = document.getElementById('run-btn');
            
            btn.disabled = true;
            btn.innerHTML = `Przetwarzanie...`;
            statusBadge.innerText = "Testowanie...";

            try {
                const response = await fetch(`/api/run-backtest?interval=${interval}&limit=${limit}`, { method: 'POST' });
                if (response.ok) {
                    statusBadge.innerText = "Gotowy";
                    loadResults();
                } else {
                    statusBadge.innerText = "Błąd";
                }
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `Uruchom test`;
            }
        }

        window.onload = loadResults;
    </script>
</body>
</html>
